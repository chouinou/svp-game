<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEX VIOLENCE POOP</title>
    <link rel="stylesheet" href="style.css">
</head>

<header class="header">
      <h1 class="title">SEX VIOLENCE POOP</h1>
      <p >SEX beats VIOLENCE | VIOLENCE beats POOP | POOP beats SEX </p>
    </header>

<body>
    <!-- row of 3 buttons  -->
    <div class="buttons">
        <button id="SEX">
            <img src ="./img/sex.png" alt = "Sex symbol" style = "width: 100px; height: 100px;">
        </button>
        <button id="VIOLENCE">
            <img src ="./img/violence.png" alt = "violence symbol" style = "width: 100px; height: 100px;">
        </button>
        <button id="POOP">
            <img src ="./img/poop.png" alt = "Poop symbol" style = "width: 100px; height: 100px;">
        </button>
    </div>
    
    <div class="score_container">
        <div class="score_display">
            <div class="score_box">
                <h1>You</h1>
                <h1 id="human-score-box"></h1>
            </div>
            <div class="score_box">
                <h1>Life</h1>
                <h1 id="computer-score-box"></h1>
            </div>
        </div>
        <p id ="round-result"></p>
    </div>

    <div class="end-game-div" id="invisible">
        <p class="end-game-text"></p>
        <button class="try-again" id="refresh">Try again !</button>
      </div>
    
 <script type="module" src="javascript.js"></script>
</body>

<footer class="footer">
      <p>
        Copyright © 2026 chouinou
      </p>
      <a href="https://github.com/chouinou" target="_blank">
        <img class="github-logo" src="./img/github-mark.svg">
      </a>
    </footer>

</html>
